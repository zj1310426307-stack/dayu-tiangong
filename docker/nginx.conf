# 前端单页路由回退到 index.html，API 请求转发至后端服务。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Browser QGIS WMS traffic must pass the FastAPI request allow-list.
    # The private qgis-server container has no host port and is never addressed here.
    location /qgis-server/ {
        proxy_pass http://backend:8000/qgis-server/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Martin is the only public MVT path; its database role can execute only tiles.* functions.
    location /vector/ {
        proxy_pass http://martin:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=300" always;
    }

    # Versioned 3D Tiles are generated into a read-only volume and never fall back to the SPA.
    location /3d/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300" always;
    }

    # 只暴露 OGC 服务。管理 REST、GeoWebCache REST 与 Web 管理台不进入浏览器边界。
    location ~ ^/geoserver/(rest|web|gwc/rest)(/|$) {
        return 404;
    }

    location /geoserver/ {
        proxy_pass http://geoserver:8080/geoserver/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # The SPA entry must never be served from a stale browser memory cache.
    # Hashed JS/CSS assets remain cacheable, while every reload re-resolves the
    # current asset names from the newly deployed index.
    location = /index.html {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
