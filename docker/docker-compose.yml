# Unified platform runtime: PostGIS + GeoServer + FastAPI + Workers + OpenLayers/Nginx.
# Keep the existing project name so an upgrade reuses the governed persistent volumes.
name: dayu-tiangong-phase1

x-backend-runtime: &backend_runtime
  image: dayu-backend:${ENGINE_COMMIT:?ENGINE_COMMIT is required}
  build:
    context: ..
    dockerfile: docker/backend.Dockerfile
    args:
      ENGINE_VERSION: ${DAYU_ENGINE_VERSION:-dayu-hydraulic-platform-5.0.0}
      ENGINE_COMMIT: ${ENGINE_COMMIT:?ENGINE_COMMIT is required}
      BUILD_MODE: ${DAYU_BUILD_MODE:-release}

services:
  database:
    build:
      context: ..
      dockerfile: docker/database.Dockerfile
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dayu_tiangong}
      POSTGRES_USER: ${POSTGRES_USER:-dayu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in an ignored .env file}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dayu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 8

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - dayu_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *backend_runtime
    command: ["python", "-m", "alembic", "-c", "../database/alembic.ini", "upgrade", "head"]
    environment: &backend_environment
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-dayu_tiangong}
      POSTGRES_USER: ${POSTGRES_USER:-dayu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in an ignored .env file}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      DAYU_STORAGE_ROOT: /app/backend/storage
      ENGINE_COMMIT: ${ENGINE_COMMIT:?ENGINE_COMMIT is required}
      DAYU_ENGINE_VERSION: ${DAYU_ENGINE_VERSION:-dayu-hydraulic-platform-5.0.0}
      DAYU_BUILD_MODE: ${DAYU_BUILD_MODE:-release}
      ENABLE_SYNC_MODEL_RUN: ${ENABLE_SYNC_MODEL_RUN:-0}
      # The stock image contains the Adapter, not MASCARET itself. Keep this off
      # until an official v9.1.1 runtime is supplied by the deployment.
      MASCARET_ENABLED: ${MASCARET_ENABLED:-0}
      MASCARET_RUNTIME: ${MASCARET_RUNTIME:-external}
      MASCARET_EXECUTABLE: ${MASCARET_EXECUTABLE:-mascaret}
      MASCARET_EXECUTABLE_SHA256: ${MASCARET_EXECUTABLE_SHA256:-}
      MASCARET_DATA_DIR: ${MASCARET_DATA_DIR:-}
      MASCARET_UPSTREAM_TAG: ${MASCARET_UPSTREAM_TAG:-v9.1.1}
      MASCARET_UPSTREAM_COMMIT: ${MASCARET_UPSTREAM_COMMIT:-1fe3b5141f7d9c9fa8fe6d6d0316c994a39c2d95}
      MASCARET_BUILD_TIMESTAMP: ${MASCARET_BUILD_TIMESTAMP:-}
      MASCARET_CONTAINER_IMAGE: ${MASCARET_CONTAINER_IMAGE:-}
      MASCARET_RETENTION_CLASS: ${MASCARET_RETENTION_CLASS:-failed}
      MASCARET_RETENTION_MAX_WORKSPACES: ${MASCARET_RETENTION_MAX_WORKSPACES:-20}
      MASCARET_TIMEOUT: ${MASCARET_TIMEOUT:-3600}
      HYDRAULIC_WORKSPACE_ROOT: /app/backend/storage/hydraulic-workspaces
      AI_LLM_PROVIDER: ${AI_LLM_PROVIDER:-local}
      AI_LLM_BASE_URL: ${AI_LLM_BASE_URL:-}
      AI_LLM_MODEL: ${AI_LLM_MODEL:-}
      AI_LLM_API_KEY: ${AI_LLM_API_KEY:-}
    depends_on:
      database:
        condition: service_healthy

  seed:
    <<: *backend_runtime
    command: ["python", "../database/seed/demo_data.py"]
    environment: *backend_environment
    depends_on:
      migrate:
        condition: service_completed_successfully

  qgis-bootstrap:
    <<: *backend_runtime
    command: ["python", "../database/bootstrap_qgis.py"]
    environment:
      <<: *backend_environment
      QGIS_EDITOR_DB_USER: ${QGIS_EDITOR_DB_USER:-dayu_qgis_editor}
      QGIS_EDITOR_DB_PASSWORD: ${QGIS_EDITOR_DB_PASSWORD:?set QGIS_EDITOR_DB_PASSWORD in an ignored .env file}
      QGIS_REVIEWER_DB_USER: ${QGIS_REVIEWER_DB_USER:-dayu_qgis_reviewer}
      QGIS_REVIEWER_DB_PASSWORD: ${QGIS_REVIEWER_DB_PASSWORD:?set QGIS_REVIEWER_DB_PASSWORD in an ignored .env file}
      QGIS_PUBLISHER_DB_USER: ${QGIS_PUBLISHER_DB_USER:-dayu_publisher}
    depends_on:
      migrate:
        condition: service_completed_successfully

  app-bootstrap:
    <<: *backend_runtime
    command: ["python", "../database/bootstrap_app.py"]
    environment:
      <<: *backend_environment
      BACKEND_DB_USER: ${BACKEND_DB_USER:-dayu_backend}
      BACKEND_DB_PASSWORD: ${BACKEND_DB_PASSWORD:?set BACKEND_DB_PASSWORD in an ignored .env file}
      QGIS_PUBLISHER_DB_USER: ${QGIS_PUBLISHER_DB_USER:-dayu_publisher}
    depends_on:
      qgis-bootstrap:
        condition: service_completed_successfully

  geoserver:
    build:
      context: ..
      dockerfile: docker/geoserver.Dockerfile
    image: dayu-geoserver:2.28.0-cjk
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:?set GEOSERVER_ADMIN_PASSWORD in an ignored .env file}
      GEOSERVER_DATA_DIR: /opt/geoserver_data
      SKIP_DEMO_DATA: "true"
      RUN_UNPRIVILEGED: "true"
      HEALTHCHECK_URL: http://127.0.0.1:8080/geoserver/web/wicket/resource/org.geoserver.web.GeoServerBasePage/img/logo.png
      EXTRA_JAVA_OPTS: ${GEOSERVER_JAVA_OPTS:--Xms256m -Xmx768m}
    ports:
      - "127.0.0.1:${GEOSERVER_PORT:-8081}:8080"
    volumes:
      - dayu_geoserver_data:/opt/geoserver_data
    depends_on:
      database:
        condition: service_healthy

  geoserver-init:
    <<: *backend_runtime
    command: ["python", "../geoserver/bootstrap.py"]
    environment:
      <<: *backend_environment
      GEOSERVER_INTERNAL_URL: http://geoserver:8080/geoserver
      GEOSERVER_ADMIN_USER: ${GEOSERVER_ADMIN_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_ADMIN_PASSWORD:?set GEOSERVER_ADMIN_PASSWORD in an ignored .env file}
      GEOSERVER_DB_HOST: database
      GEOSERVER_DB_USER: ${GEOSERVER_DB_USER:-dayu_geoserver}
      GEOSERVER_DB_PASSWORD: ${GEOSERVER_DB_PASSWORD:?set GEOSERVER_DB_PASSWORD in an ignored .env file}
      GEOSERVER_DB_SCHEMA: publish
      GEOSERVER_WORKSPACE: dayu
      GEOSERVER_DATASTORE: dayu_postgis
    depends_on:
      geoserver:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      app-bootstrap:
        condition: service_completed_successfully

  gis-catalog-seed:
    <<: *backend_runtime
    command: ["python", "../database/seed/gis_catalog.py"]
    environment:
      <<: *backend_environment
      GEOSERVER_DB_USER: ${GEOSERVER_DB_USER:-dayu_geoserver}
    depends_on:
      geoserver-init:
        condition: service_completed_successfully

  backend:
    <<: *backend_runtime
    environment:
      <<: *backend_environment
      POSTGRES_USER: ${BACKEND_DB_USER:-dayu_backend}
      POSTGRES_PASSWORD: ${BACKEND_DB_PASSWORD:?set BACKEND_DB_PASSWORD in an ignored .env file}
      GEOSERVER_INTERNAL_URL: http://geoserver:8080/geoserver
      # GeoServer diagnostics retain the direct same-origin OGC path; the
      # OpenLayers Catalog independently uses the allow-listed FastAPI WMS gateway.
      GEOSERVER_PUBLIC_WMS_URL: /geoserver/dayu/wms
      GEOSERVER_PUBLIC_WMTS_URL: /geoserver/gwc/service/wmts
      GEOSERVER_PUBLIC_WFS_URL: /geoserver/dayu/ows
      GEOSERVER_WORKSPACE: dayu
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8001}:8000"
    volumes:
      - ${DAYU_STORAGE_HOST_PATH:-../backend/storage}:/app/backend/storage
    depends_on:
      gis-catalog-seed:
        condition: service_completed_successfully
      app-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/gis/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6

  worker:
    <<: *backend_runtime
    command: ["python", "-m", "celery", "-A", "app.worker.celery_app:celery_app", "worker", "--loglevel=INFO", "--pool=solo"]
    environment:
      <<: *backend_environment
      POSTGRES_USER: ${BACKEND_DB_USER:-dayu_backend}
      POSTGRES_PASSWORD: ${BACKEND_DB_PASSWORD:?set BACKEND_DB_PASSWORD in an ignored .env file}
    volumes:
      - ${DAYU_STORAGE_HOST_PATH:-../backend/storage}:/app/backend/storage
    depends_on:
      seed:
        condition: service_completed_successfully
      app-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app:celery_app inspect ping -d celery@$${HOSTNAME} --timeout 3 | grep -q pong"]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 20s

  hydraulic-worker:
    <<: *backend_runtime
    command:
      [
        "python",
        "-m",
        "celery",
        "-A",
        "app.worker.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--pool=solo",
        "--queues=hydraulic-1d",
        "--hostname=hydraulic-1d@%h",
      ]
    environment:
      <<: *backend_environment
      POSTGRES_USER: ${BACKEND_DB_USER:-dayu_backend}
      POSTGRES_PASSWORD: ${BACKEND_DB_PASSWORD:?set BACKEND_DB_PASSWORD in an ignored .env file}
    volumes:
      - ${DAYU_STORAGE_HOST_PATH:-../backend/storage}:/app/backend/storage
    depends_on:
      seed:
        condition: service_completed_successfully
      app-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A app.worker.celery_app:celery_app inspect ping -d hydraulic-1d@$${HOSTNAME} --timeout 3 | grep -q pong",
        ]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 20s

  scheduler:
    <<: *backend_runtime
    command:
      [
        "python",
        "-m",
        "celery",
        "-A",
        "app.worker.celery_app:celery_app",
        "beat",
        "--loglevel=INFO",
      ]
    environment:
      <<: *backend_environment
      POSTGRES_USER: ${BACKEND_DB_USER:-dayu_backend}
      POSTGRES_PASSWORD: ${BACKEND_DB_PASSWORD:?set BACKEND_DB_PASSWORD in an ignored .env file}
    depends_on:
      app-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from pathlib import Path; cmd=Path('/proc/1/cmdline').read_bytes(); assert b'celery' in cmd and b'beat' in cmd",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
      geoserver-init:
        condition: service_completed_successfully

volumes:
  dayu_postgres_data:
  dayu_redis_data:
  dayu_geoserver_data:
