# Private FastCGI endpoint used only inside the Compose network.
# Explicit service/project paths avoid depending on implicit CGI environment
# propagation while keeping credentials in the inherited process environment.
location = /dayu-ows/ {
    fastcgi_pass localhost:9993;
    fastcgi_param SCRIPT_FILENAME /var/www/data/qgis/qgis_mapserv.fcgi;
    fastcgi_param QUERY_STRING $query_string;
    fastcgi_param HTTPS $qgis_ssl;
    fastcgi_param SERVER_NAME $qgis_host;
    fastcgi_param SERVER_PORT $qgis_port;
    fastcgi_param QGIS_PROJECT_FILE /srv/qgis/dayu_tiangong_server.qgz;
    fastcgi_param PGSERVICEFILE /srv/qgis/pg_service.server.conf;
    fastcgi_param PGPASSFILE /tmp/dayu_qgis_server.pgpass;
    include fastcgi_params;
}
