schema_version: 1
case_code: HYDRO-DATA-02-PUBLIC-TEMPLATE
captured_at: null

publication:
  mode: sanitized_public_template
  controlled_evidence_published: false
  private_manifest_required: true
  note: >-
    真实企业名称、工程名称、文件名、相对路径、文件大小、SHA-256、空间范围和组件清单
    均留在本地受控清单中，未发布到公开仓库。

root:
  env_var: HYDRO_VALIDATION_CASE_ROOT
  expected_basename: null
  absolute_path_committed: false
  fail_if_missing: true

integrity:
  algorithm: sha256
  verify_before_read: true
  reject_on_mismatch: true
  expected_digest_source: controlled_local_manifest

data_handling:
  classification: controlled_engineering_data
  raw_files_in_repository: prohibited
  source_paths_in_repository: prohibited
  digests_and_byte_sizes_in_repository: prohibited
  exact_extents_in_repository: prohibited
  case_specific_mapping_in_repository: prohibited
  large_or_sensitive_outputs_in_repository: prohibited

