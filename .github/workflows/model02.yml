name: model02

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONPATH: backend:.
  ENGINE_COMMIT: ${{ github.sha }}
  DAYU_ENGINE_VERSION: dayu-hydraulic-platform-5.0.0
  DAYU_BUILD_MODE: ci
  # Hosted CI validates the Adapter and parser without pretending that MASCARET is installed.
  MASCARET_ENABLED: "0"
  MASCARET_RUNTIME: cli
  MASCARET_EXECUTABLE: mascaret.py
  HYDRAULIC_WORKSPACE_ROOT: outputs/ci/hydraulic-workspaces

jobs:
  model02:
    name: MODEL02 ${{ matrix.platform }} Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Ubuntu
            artifact-suffix: ubuntu
            python-version: "3.11"
          - os: windows-latest
            platform: Windows
            artifact-suffix: windows
            python-version: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile platform and Backend
        run: python -m compileall -q model backend/app
      - name: Prepare evidence directory
        run: python -c "from pathlib import Path; Path('outputs/ci/model02').mkdir(parents=True, exist_ok=True)"
      - name: Run MASCARET Adapter and benchmark contracts
        run: >-
          python -m pytest -c backend/pyproject.toml -p no:cacheprovider -q
          tests/hydraulic_1d tests/benchmark/hydraulic_1d
          --junitxml=outputs/ci/model02/junit-${{ matrix.artifact-suffix }}.xml
      - name: Upload MODEL02 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: model02-${{ matrix.artifact-suffix }}-py311
          path: outputs/ci/model02/
          if-no-files-found: error

  # This protected display name is intentionally retained while its old Solver semantics are retired.
  legacy-hydraulic:
    name: Legacy hydraulic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Reject retired production Solver paths
        shell: bash
        run: |
          tracked="$(git ls-files 'model/solver/**' 'model/network/solver.py' 'model/adapters/v4*.py' 'model/api/v4*.py')"
          if [ -n "$tracked" ]; then
            printf '%s\n' "$tracked"
            echo "Retired custom 1D Solver files remain tracked."
            exit 1
          fi
          if git grep -n -E '(from|import)[[:space:]]+model\.(solver|network\.solver)' -- backend/app model; then
            echo "Production imports a retired custom 1D Solver."
            exit 1
          fi
      - name: Reject vendored MASCARET source
        shell: bash
        run: test -z "$(git ls-files 'third_party/mascaret/**' 'vendor/mascaret/**')"
      - name: Run isolation and validation contracts
        run: >-
          python -m pytest -c backend/pyproject.toml -p no:cacheprovider -q
          tests/hydraulic_1d

  # Protected display name retained; this now validates the external-engine benchmark layer.
  d3a-scientific-validation:
    name: D3A scientific validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Run solver-neutral hydraulic benchmarks
        run: >-
          python -m pytest -c backend/pyproject.toml -p no:cacheprovider -q
          tests/benchmark/hydraulic_1d

  # This required context validates the shipping image, but does not claim a bundled MASCARET runtime.
  d3a-shipping-science:
    name: D3A shipping science
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Python 3.12 platform image
        run: |
          docker build \
            --build-arg ENGINE_VERSION="$DAYU_ENGINE_VERSION" \
            --build-arg ENGINE_COMMIT="$ENGINE_COMMIT" \
            --build-arg BUILD_MODE="$DAYU_BUILD_MODE" \
            --tag "dayu-hydraulic-platform:$ENGINE_COMMIT" \
            --file docker/backend.Dockerfile .
          test "$(docker run --rm "dayu-hydraulic-platform:$ENGINE_COMMIT" python -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" = "3.12"
      - name: Verify external runtime remains disabled by default
        run: >-
          docker run --rm "dayu-hydraulic-platform:$ENGINE_COMMIT"
          python -c "import os, shutil; assert os.environ['MASCARET_ENABLED'] == '0'; assert shutil.which('mascaret.py') is None"
      - name: Run Adapter contracts in shipping image
        run: |
          mkdir -p outputs/ci/shipping
          docker run --rm \
            --volume "$PWD:/workspace:ro" \
            --volume "$PWD/outputs:/workspace/outputs" \
            --workdir /workspace \
            --env PYTHONPATH=/workspace/backend:/workspace \
            --env MASCARET_ENABLED=0 \
            "dayu-hydraulic-platform:$ENGINE_COMMIT" \
            python -m pytest -c backend/pyproject.toml -p no:cacheprovider -q \
            tests/hydraulic_1d tests/benchmark/hydraulic_1d \
            --junitxml=outputs/ci/shipping/junit.xml
      - name: Upload shipping evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hydraulic-platform-shipping
          path: outputs/ci/shipping/
          if-no-files-found: error

  frontend-contract:
    name: Frontend contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
