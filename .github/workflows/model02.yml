name: model02

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  ENGINE_COMMIT: ${{ github.sha }}
  DAYU_ENGINE_VERSION: dayu-hydraulic-4.0.0
  DAYU_BUILD_MODE: ci

jobs:
  model02:
    name: MODEL02 ${{ matrix.platform }} Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: Ubuntu
            artifact-suffix: ubuntu
            python-version: "3.11"
          - os: windows-latest
            platform: Windows
            artifact-suffix: windows
            python-version: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile model and backend
        run: python -m compileall -q model backend/app
      - name: Record cross-platform diagnostic
        run: >-
          python tools/diagnose_model02_cross_platform.py
          --output outputs/ci/model02/cross-platform-diagnostic.json
      - name: Run MODEL-02 tests
        id: model02-tests
        continue-on-error: true
        run: >-
          python -m pytest -c backend/pyproject.toml -p no:cacheprovider
          tests/model02 -q -m "not d3a_shipping_science"
          --junitxml=outputs/ci/model02/junit.xml
      - name: Summarize MODEL-02 JUnit
        if: always() && hashFiles('outputs/ci/model02/junit.xml') != ''
        run: >-
          python tools/summarize_junit.py
          --input outputs/ci/model02/junit.xml
          --output outputs/ci/model02/summary.json
      - name: Upload MODEL-02 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: model02-${{ matrix.artifact-suffix }}-py311
          path: outputs/ci/model02/
          if-no-files-found: error
      - name: Enforce MODEL-02 result
        if: always() && steps.model02-tests.outcome != 'success'
        run: python -c "raise SystemExit('MODEL-02 tests failed')"

  legacy-hydraulic:
    name: Legacy hydraulic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Prepare evidence directory
        run: >-
          python -c "from pathlib import Path;
          Path('outputs/ci/legacy').mkdir(parents=True, exist_ok=True)"
      - name: Run legacy hydraulic regressions
        id: legacy-tests
        continue-on-error: true
        run: >-
          python -m pytest -c backend/pyproject.toml -p no:cacheprovider -q
          tests/test_hydraulic_engine.py
          tests/test_pump_model.py
          tests/test_gate_model.py
          tests/test_phase4_hydraulic_gate.py
          tests/test_gate_pump_simulation.py
          tests/test_dispatch_engine.py
          --junitxml=outputs/ci/legacy/junit.xml
      - name: Summarize legacy JUnit
        if: always() && hashFiles('outputs/ci/legacy/junit.xml') != ''
        run: >-
          python tools/summarize_junit.py
          --input outputs/ci/legacy/junit.xml
          --output outputs/ci/legacy/summary.json
      - name: Upload legacy evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: legacy-hydraulic-ubuntu-py311
          path: outputs/ci/legacy/
          if-no-files-found: error
      - name: Enforce legacy result
        if: always() && steps.legacy-tests.outcome != 'success'
        run: python -c "raise SystemExit('legacy hydraulic tests failed')"

  d3a-scientific-validation:
    name: D3A scientific validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Prepare D3A evidence directory
        run: >-
          python -c "from pathlib import Path;
          Path('outputs/ci/model02-d3a').mkdir(parents=True, exist_ok=True)"
      - name: Run unlocked D3A science gates
        id: d3a-tests
        continue-on-error: true
        run: >-
          python -m pytest -c backend/pyproject.toml -p no:cacheprovider -q
          tests/model02/test_d3a_manning_science.py
          tests/model02/test_d3a_manning_gate_pump.py
          tests/model02/test_d3a_slope_science.py
          tests/model02/test_nonprismatic_moving_convergence.py
          tests/model02/test_d3a_nonprismatic_science.py
          tests/model02/test_d3a_runtime_envelope.py
          tests/model02/test_d3a_final_convergence.py
          tests/model_engine/test_v4_d3a_1_execution.py
          tests/model_engine/test_v4_d3a_2_execution.py
          tests/model_engine/test_v4_d3a_3_execution.py
          tests/model_engine/test_d3a_2_schema_metadata.py
          tests/model_engine/test_v4_readiness.py
          tests/model_engine/test_solver_registry.py
          --junitxml=outputs/ci/model02-d3a/junit.xml
      - name: Summarize D3A JUnit
        if: always() && hashFiles('outputs/ci/model02-d3a/junit.xml') != ''
        run: >-
          python tools/summarize_junit.py
          --input outputs/ci/model02-d3a/junit.xml
          --output outputs/ci/model02-d3a/summary.json
      - name: Upload D3A evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: model02-d3a-ubuntu-py311
          path: outputs/ci/model02-d3a/
          if-no-files-found: error
      - name: Enforce D3A result
        if: always() && steps.d3a-tests.outcome != 'success'
        run: python -c "raise SystemExit('D3A scientific validation failed')"

  d3a-shipping-science:
    name: D3A shipping science
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare D3A shipping-science evidence
        run: mkdir -p outputs/ci/d3a-shipping-science
      - name: Build immutable Python 3.12 shipping image
        run: |
          docker build \
            --build-arg ENGINE_VERSION="$DAYU_ENGINE_VERSION" \
            --build-arg ENGINE_COMMIT="$ENGINE_COMMIT" \
            --build-arg BUILD_MODE="$DAYU_BUILD_MODE" \
            --tag "dayu-d3a-science:$ENGINE_COMMIT" \
            --file docker/backend.Dockerfile .
          test "$(docker run --rm "dayu-d3a-science:$ENGINE_COMMIT" python -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')" = "3.12"
      - name: Run D3A science inside shipping image
        id: d3a-shipping-tests
        continue-on-error: true
        run: |
          docker run --rm \
            --volume "$PWD:/workspace:ro" \
            --volume "$PWD/outputs:/workspace/outputs" \
            --workdir /workspace \
            --env D3A_FINAL_CONVERGENCE_ARTIFACT=outputs/ci/d3a-shipping-science/final-convergence.json \
            "dayu-d3a-science:$ENGINE_COMMIT" \
            python -m pytest -c backend/pyproject.toml -p no:cacheprovider -q \
            tests/model02/test_d3a_manning_science.py \
            tests/model02/test_d3a_manning_gate_pump.py \
            tests/model02/test_d3a_slope_science.py \
            tests/model02/test_nonprismatic_moving_convergence.py \
            tests/model02/test_d3a_nonprismatic_science.py \
            tests/model02/test_d3a_runtime_envelope.py \
            tests/model02/test_d3a_final_convergence.py \
            tests/model_engine/test_v4_d3a_1_execution.py \
            tests/model_engine/test_v4_d3a_2_execution.py \
            tests/model_engine/test_v4_d3a_3_execution.py \
            tests/model_engine/test_v4_d3a_runtime_envelope.py \
            --junitxml=outputs/ci/d3a-shipping-science/junit.xml
      - name: Collect Python, build, Registry and envelope identities
        if: always() && hashFiles('outputs/ci/d3a-shipping-science/final-convergence.json') != ''
        run: |
          docker run --rm \
            --volume "$PWD:/workspace:ro" \
            --volume "$PWD/outputs:/workspace/outputs" \
            --workdir /workspace \
            "dayu-d3a-science:$ENGINE_COMMIT" \
            python tools/collect_d3a_shipping_science.py \
            --evidence-dir outputs/ci/d3a-shipping-science \
            --final-convergence outputs/ci/d3a-shipping-science/final-convergence.json
      - name: Summarize D3A shipping JUnit
        if: always() && hashFiles('outputs/ci/d3a-shipping-science/junit.xml') != ''
        run: >-
          docker run --rm
          --volume "$PWD:/workspace:ro"
          --volume "$PWD/outputs:/workspace/outputs"
          --workdir /workspace
          "dayu-d3a-science:$ENGINE_COMMIT"
          python tools/summarize_junit.py
          --input outputs/ci/d3a-shipping-science/junit.xml
          --output outputs/ci/d3a-shipping-science/summary.json
      - name: Upload D3A shipping science
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: d3a-shipping-science
          path: outputs/ci/d3a-shipping-science/
          if-no-files-found: error
      - name: Enforce D3A shipping-science result
        if: always() && steps.d3a-shipping-tests.outcome != 'success'
        run: python -c "raise SystemExit('D3A shipping science failed')"

  frontend-contract:
    name: Frontend contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
