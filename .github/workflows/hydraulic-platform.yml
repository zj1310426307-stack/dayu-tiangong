name: hydraulic-platform

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONPATH: backend:.
  ENGINE_COMMIT: ${{ github.sha }}
  DAYU_ENGINE_VERSION: dayu-hydraulic-platform-5.0.0
  DAYU_BUILD_MODE: ci
  MASCARET_ENABLED: "0"
  MASCARET_RUNTIME: cli
  MASCARET_EXECUTABLE: mascaret.py
  MASCARET_TIMEOUT: "3600"
  HYDRAULIC_WORKSPACE_ROOT: outputs/ci/hydraulic-workspaces

jobs:
  # Protected display name retained during the architecture transition.
  backend-v4-contract:
    name: Backend v4 contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m compileall -q model backend/app
      - name: Run unified 1D contract suite
        run: >-
          python -m pytest -c backend/pyproject.toml -p no:cacheprovider -q
          tests/hydraulic_1d tests/benchmark/hydraulic_1d

  postgis-migration:
    name: PostGIS migration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb-ha:pg16.14-ts2.28.3-all
        env:
          POSTGRES_DB: dayu_tiangong
          POSTGRES_USER: dayu
          POSTGRES_PASSWORD: dayu_dev
          TIMESCALEDB_TELEMETRY: "off"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dayu -d dayu_tiangong"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://dayu:dayu_dev@localhost:5432/dayu_tiangong
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Upgrade to current head
        run: alembic -c database/alembic.ini upgrade head
      - name: Verify unified hydraulic fields
        run: >-
          python -c "from sqlalchemy import create_engine, inspect; import os;
          i=inspect(create_engine(os.environ['DATABASE_URL']));
          case={c['name'] for c in i.get_columns('simulation_case')};
          boundary={c['name'] for c in i.get_columns('boundary_condition')};
          result={c['name']: c for c in i.get_columns('hydraulic_task_section_result')};
          assert 'hydraulic_1d_configuration' in case;
          assert {'hydraulic_node_id','branch_id','chainage_m'} <= boundary;
          assert any(set(fk['constrained_columns']) == {'branch_id','dataset_version_id'}
          and fk['referred_schema'] == 'hydraulic' and fk['referred_table'] == 'branch'
          for fk in i.get_foreign_keys('boundary_condition'));
          assert {'depth_m','flow_area_m2','wet_area_m2','hydraulic_radius_m','top_width_m','froude_number'} <= set(result);
          assert result['control_volume_m3']['nullable']"
      - name: Round-trip latest migration
        run: |
          alembic -c database/alembic.ini downgrade -1
          alembic -c database/alembic.ini upgrade head
          test "$(alembic -c database/alembic.ini heads | grep -c '(head)')" -eq 1

  worker-integration:
    name: Worker integration
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Start isolated hydraulic Worker
        run: >-
          nohup python -m celery -A app.worker.celery_app:celery_app worker
          --loglevel=INFO --pool=solo --queues=hydraulic-1d
          --hostname=hydraulic-1d-ci@%h >/tmp/hydraulic-1d-worker.log 2>&1 &
      - name: Verify Worker is reachable
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if python -m celery -A app.worker.celery_app:celery_app inspect ping \
              -d "hydraulic-1d-ci@$(hostname)" --timeout 3 | grep -q pong; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/hydraulic-1d-worker.log
          exit 1
      - name: Run runtime boundary contracts
        run: >-
          python -m pytest -c backend/pyproject.toml -p no:cacheprovider -q
          tests/hydraulic_1d/test_runtime_boundary.py

  # Protected display name retained; now covers external-process failure and cleanup boundaries.
  d2-fault-recovery:
    name: D2 fault recovery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Run validation, workspace and runtime failure contracts
        run: >-
          python -m pytest -c backend/pyproject.toml -p no:cacheprovider -q
          tests/hydraulic_1d/test_mascaret_validation.py
          tests/hydraulic_1d/test_runtime_boundary.py

  frontend-openapi:
    name: Frontend OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - name: Start OpenAPI source
        run: nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8001 >/tmp/dayu-openapi.log 2>&1 &
      - name: Regenerate client
        working-directory: frontend
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8001/openapi.json >/dev/null; then break; fi
            sleep 1
          done
          npm run openapi:update
      - name: Enforce generated-client drift gate
        run: git diff --exit-code -- frontend/src/api/generated/client.ts
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  # Protected display name retained; current content is the solver-neutral benchmark gate.
  d1-regression:
    name: D1 regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: Run five hydraulic 1D benchmark families
        run: >-
          python -m pytest -c backend/pyproject.toml -p no:cacheprovider -q
          tests/benchmark/hydraulic_1d

  # Protected display name retained; validates image identity and Adapter availability only.
  d2-shipping-runtime:
    name: D2 shipping runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build immutable platform image
        run: |
          docker build \
            --build-arg ENGINE_VERSION="$DAYU_ENGINE_VERSION" \
            --build-arg ENGINE_COMMIT="$ENGINE_COMMIT" \
            --build-arg BUILD_MODE="$DAYU_BUILD_MODE" \
            --tag "dayu-backend:$ENGINE_COMMIT" \
            --file docker/backend.Dockerfile .
          test "$(docker image inspect --format='{{ index .Config.Labels "org.opencontainers.image.revision" }}' "dayu-backend:$ENGINE_COMMIT")" = "$ENGINE_COMMIT"
          docker run --rm "dayu-backend:$ENGINE_COMMIT" python -m model.build_identity
      - name: Verify MASCARET is external and fail-closed by default
        run: >-
          docker run --rm "dayu-backend:$ENGINE_COMMIT"
          python -c "import os, shutil; from model.hydraulic_1d.factory import create_hydraulic_1d_engine;
          assert os.environ['MASCARET_ENABLED'] == '0'; assert shutil.which('mascaret.py') is None;
          available, reason=create_hydraulic_1d_engine().availability(); assert not available; assert 'disabled' in reason"
      - name: Run Adapter and parser tests in image
        run: >-
          docker run --rm --volume "$PWD:/workspace:ro" --workdir /workspace
          --env PYTHONPATH=/workspace/backend:/workspace --env MASCARET_ENABLED=0
          "dayu-backend:$ENGINE_COMMIT"
          python -m pytest -c backend/pyproject.toml -p no:cacheprovider -q tests/hydraulic_1d
