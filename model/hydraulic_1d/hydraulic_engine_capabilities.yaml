schema_version: dayu.hydraulic-engine-capabilities.v2
engines:
  - engine: mascaret
    engine_version: v9.1.1
    adapter_version: dayu-mascaret-adapter-v2
    upstream_tag: v9.1.1
    upstream_commit: 1fe3b5141f7d9c9fa8fe6d6d0316c994a39c2d95
    capabilities:
      - feature: UNSTEADY_1D
        status: VERIFIED_NATIVE
        benchmark_ids: [B01, B02, B03, B04, B05]
        verified_at: 2026-09-01
        reason: Official runtime and the five retained Standard 1D benchmarks pass.
      - feature: STEADY_1D
        status: UNVERIFIED
        benchmark_ids: []
        reason: The production adapter currently emits the unsteady transcritical kernel only.
      - feature: BRANCHED_NETWORK
        status: VERIFIED_NATIVE
        benchmark_ids: [N01, N02, N03]
        verified_at: 2026-09-01
        reason: Native listeBranches/listeNoeuds mapping is covered by real runtime cases.
      - feature: LATERAL_INFLOW
        status: VERIFIED_NATIVE
        benchmark_ids: [N04, N05]
        verified_at: 2026-09-01
        reason: Native debitsApports mapping is covered by time-varying real runtime cases.
      - feature: COMBINED_BOUNDARIES
        status: VERIFIED_NATIVE
        benchmark_ids: [N05]
        verified_at: 2026-09-01
        reason: Multiple upstream hydrographs, downstream stage, and lateral inflow are verified together.
      - feature: WEIR
        status: VERIFIED_NATIVE
        benchmark_ids: [S01]
        verified_at: 2026-09-01
        reason: A fixed geometric broad-crested weir maps to the native geometric seuil and passes a real runtime case.
      - feature: CULVERT
        status: UNVERIFIED
        benchmark_ids: []
        reason: No equivalent Dayu-to-MASCARET engineering mapping has passed a runtime benchmark.
      - feature: BRIDGE
        status: UNVERIFIED
        benchmark_ids: []
        reason: No native bridge semantics were established for the pinned MASCARET adapter.
      - feature: GATE
        status: UNSUPPORTED
        benchmark_ids: []
        reason: Gate remains explicitly disabled pending a complete semantic and runtime acceptance phase.
      - feature: SLUICE
        status: UNSUPPORTED
        benchmark_ids: []
        reason: Sluice operation is not mapped by the production adapter.
      - feature: PUMP
        status: UNSUPPORTED
        benchmark_ids: []
        reason: MASCARET Pump support is not available through the verified adapter.
      - feature: ORIFICE
        status: UNVERIFIED
        benchmark_ids: []
        reason: No verified production mapping exists.
      - feature: DAM
        status: UNVERIFIED
        benchmark_ids: []
        reason: Dam/breach semantics require a dedicated engineering acceptance scope.
      - feature: STORAGE_LINK
        status: UNVERIFIED
        benchmark_ids: []
        reason: Storage connection and liaison semantics are not integrated.
      - feature: COMPOUND
        status: UNVERIFIED
        benchmark_ids: []
        reason: Compound structures must be decomposed only by a future verified mapping.
      - feature: CASIER
        status: UNVERIFIED
        benchmark_ids: []
        reason: Official source support exists, but Dayu geometry, liaison, and runtime benchmarks are not complete.
  - engine: d-flow-fm
    engine_version: DIMRset_2026.02
    adapter_version: dayu-dflow-fm-adapter-v1
    upstream_tag: DIMRset_2026.02
    upstream_commit: 5a4649830b1e5072caf019fb4850bbdefd9ad431
    capabilities:
      - feature: UNSTEADY_1D
        production_status: EXPERIMENTAL
        synthetic_status: ACCEPTED
        production_eligible: false
        evidence_class: SYNTHETIC_NUMERICAL_ONLY
        accepted_cases: [DF01, PUMP01, PUMP02, GP01, GP02, GP03, L01]
        supported_subset: [typed 1D network, exact boundaries, native H/Q history]
        unsupported_subset: [real engineering calibration, production operation]
        reason: Locked D-Flow FM runtime passes source-controlled synthetic 1D cases; no real engineering validation exists.
      - feature: STEADY_1D
        production_status: UNVERIFIED
        synthetic_status: NOT_ACCEPTED
        production_eligible: false
        reason: No Dayu steady-flow mapping or runtime benchmark is accepted yet.
      - feature: BRANCHED_NETWORK
        production_status: EXPERIMENTAL
        synthetic_status: ACCEPTED
        production_eligible: false
        evidence_class: SYNTHETIC_NUMERICAL_ONLY
        accepted_cases: [DF01]
        reason: Explicit projected nodes, directed branches, mesh and cross-section locations pass synthetic runtime acceptance only.
      - feature: LATERAL_INFLOW
        production_status: UNVERIFIED
        synthetic_status: NOT_ACCEPTED
        production_eligible: false
        reason: Lateral inflow mapping has not passed an external-runtime benchmark.
      - feature: COMBINED_BOUNDARIES
        production_status: UNVERIFIED
        synthetic_status: NOT_ACCEPTED
        production_eligible: false
        reason: Combined boundary semantics have not passed an external-runtime benchmark.
      - feature: WEIR
        production_status: UNVERIFIED
        synthetic_status: NOT_ACCEPTED
        production_eligible: false
        reason: No Dayu-to-D-Flow FM weir mapping has passed a controlled benchmark.
      - feature: CULVERT
        production_status: UNVERIFIED
        synthetic_status: NOT_ACCEPTED
        production_eligible: false
        reason: The earlier serialization spike is not accepted runtime evidence.
      - feature: BRIDGE
        production_status: UNVERIFIED
        synthetic_status: NOT_ACCEPTED
        production_eligible: false
        reason: The earlier serialization spike is not accepted runtime evidence.
      - feature: GATE
        production_status: EXPERIMENTAL
        synthetic_status: ACCEPTED
        production_eligible: false
        evidence_class: SYNTHETIC_NUMERICAL_ONLY
        accepted_cases: [G01, G02, G03, GP01, GP02, GP03]
        supported_subset: [vertical underflow Gate, fixed opening, manual schedule, one scalar water-level rule]
        unsupported_subset: [multiple Gate priority, production control]
        reason: Native Gate mapping and the listed synthetic fixed/manual/simple-rule cases pass on the locked runtime.
      - feature: SLUICE
        production_status: UNVERIFIED
        synthetic_status: NOT_ACCEPTED
        production_eligible: false
        reason: Sluice semantics and native mapping are not implemented.
      - feature: PUMP
        production_status: EXPERIMENTAL
        synthetic_status: ACCEPTED
        production_eligible: false
        evidence_class: SYNTHETIC_NUMERICAL_ONLY
        accepted_cases: [PUMP01, PUMP02, GP01, GP02, GP03, L01]
        supported_subset: [inline non-staged Pump, fixed aggregate capacity, manual aggregate-capacity schedule, explicit synthetic head-reduction curve]
        unsupported_subset: [pump_enabled, pump_unit_count, staged Pump, real equipment curve, PLC/SCADA]
        reason: Native aggregate capacity and actual discharge are independently observed in synthetic runtime cases; unit and equipment semantics remain unsupported.
      - feature: ORIFICE
        production_status: EXPERIMENTAL
        synthetic_status: ACCEPTED
        production_eligible: false
        evidence_class: SYNTHETIC_NUMERICAL_ONLY
        accepted_cases: [G01, G02, G03, GP01, GP02, GP03]
        reason: The audited vertical-underflow Gate subset maps to native Orifice and passes listed synthetic cases.
      - feature: DAM
        production_status: UNVERIFIED
        synthetic_status: NOT_ACCEPTED
        production_eligible: false
        reason: Dam and breach semantics are not part of the adapter contract.
      - feature: STORAGE_LINK
        production_status: UNVERIFIED
        synthetic_status: NOT_ACCEPTED
        production_eligible: false
        reason: Storage linkage semantics are not part of the adapter contract.
      - feature: COMPOUND
        production_status: UNVERIFIED
        synthetic_status: NOT_ACCEPTED
        production_eligible: false
        reason: Compound structures require a future explicit mapping and benchmark.
      - feature: CASIER
        production_status: UNVERIFIED
        synthetic_status: NOT_ACCEPTED
        production_eligible: false
        reason: No Dayu storage-area mapping has passed a controlled benchmark.
      - feature: DYNAMIC_CONTROL
        production_status: EXPERIMENTAL
        synthetic_status: ACCEPTED
        production_eligible: false
        evidence_class: SYNTHETIC_NUMERICAL_ONLY
        accepted_cases: [DRTC-S01, G02, G03, PUMP02, GP02, GP03]
        supported_subset: [one Gate schedule, one Pump capacity schedule, joint Gate/Pump schedules, one Gate scalar threshold, one Gate threshold plus an independent Pump schedule]
        unsupported_subset: [pump_enabled, pump_unit_count, Pump threshold, priority arbitration, hold, cooldown]
        reason: FBC drives exact audited Gate and aggregate Pump BMI targets in the listed synthetic cases.
      - feature: D_RTC
        production_status: UNVERIFIED
        synthetic_status: ACCEPTED
        production_eligible: false
        evidence_class: SYNTHETIC_NUMERICAL_ONLY
        accepted_cases: [DRTC-S01, G03, GP03]
        supported_subset: [single scalar Gate threshold, explicit frozen fallback, independent Pump capacity schedule]
        unsupported_subset: [hysteresis, minimum hold, cooldown, multiple-rule priority, Pump threshold]
        reason: The minimal Gate threshold subset is accepted on the pinned FBC runtime; all wider D-RTC semantics remain fail closed.
