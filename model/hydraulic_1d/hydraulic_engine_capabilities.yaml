schema_version: dayu.hydraulic-engine-capabilities.v1
engines:
  - engine: mascaret
    engine_version: v9.1.1
    adapter_version: dayu-mascaret-adapter-v2
    upstream_tag: v9.1.1
    upstream_commit: 1fe3b5141f7d9c9fa8fe6d6d0316c994a39c2d95
    capabilities:
      - feature: UNSTEADY_1D
        status: VERIFIED_NATIVE
        benchmark_ids: [B01, B02, B03, B04, B05]
        verified_at: 2026-09-01
        reason: Official runtime and the five retained Standard 1D benchmarks pass.
      - feature: STEADY_1D
        status: UNVERIFIED
        benchmark_ids: []
        reason: The production adapter currently emits the unsteady transcritical kernel only.
      - feature: BRANCHED_NETWORK
        status: VERIFIED_NATIVE
        benchmark_ids: [N01, N02, N03]
        verified_at: 2026-09-01
        reason: Native listeBranches/listeNoeuds mapping is covered by real runtime cases.
      - feature: LATERAL_INFLOW
        status: VERIFIED_NATIVE
        benchmark_ids: [N04, N05]
        verified_at: 2026-09-01
        reason: Native debitsApports mapping is covered by time-varying real runtime cases.
      - feature: COMBINED_BOUNDARIES
        status: VERIFIED_NATIVE
        benchmark_ids: [N05]
        verified_at: 2026-09-01
        reason: Multiple upstream hydrographs, downstream stage, and lateral inflow are verified together.
      - feature: WEIR
        status: VERIFIED_NATIVE
        benchmark_ids: [S01]
        verified_at: 2026-09-01
        reason: A fixed geometric broad-crested weir maps to the native geometric seuil and passes a real runtime case.
      - feature: CULVERT
        status: UNVERIFIED
        benchmark_ids: []
        reason: No equivalent Dayu-to-MASCARET engineering mapping has passed a runtime benchmark.
      - feature: BRIDGE
        status: UNVERIFIED
        benchmark_ids: []
        reason: No native bridge semantics were established for the pinned MASCARET adapter.
      - feature: GATE
        status: UNSUPPORTED
        benchmark_ids: []
        reason: Gate remains explicitly disabled pending a complete semantic and runtime acceptance phase.
      - feature: SLUICE
        status: UNSUPPORTED
        benchmark_ids: []
        reason: Sluice operation is not mapped by the production adapter.
      - feature: PUMP
        status: UNSUPPORTED
        benchmark_ids: []
        reason: MASCARET Pump support is not available through the verified adapter.
      - feature: ORIFICE
        status: UNVERIFIED
        benchmark_ids: []
        reason: No verified production mapping exists.
      - feature: DAM
        status: UNVERIFIED
        benchmark_ids: []
        reason: Dam/breach semantics require a dedicated engineering acceptance scope.
      - feature: STORAGE_LINK
        status: UNVERIFIED
        benchmark_ids: []
        reason: Storage connection and liaison semantics are not integrated.
      - feature: COMPOUND
        status: UNVERIFIED
        benchmark_ids: []
        reason: Compound structures must be decomposed only by a future verified mapping.
      - feature: CASIER
        status: UNVERIFIED
        benchmark_ids: []
        reason: Official source support exists, but Dayu geometry, liaison, and runtime benchmarks are not complete.
  - engine: d-flow-fm
    engine_version: DIMRset_2026.02
    adapter_version: dayu-dflow-fm-adapter-v1
    upstream_tag: DIMRset_2026.02
    upstream_commit: 5a4649830b1e5072caf019fb4850bbdefd9ad431
    capabilities:
      - feature: UNSTEADY_1D
        status: EXPERIMENTAL
        benchmark_ids: []
        reason: The typed HYDROLIB-core base-1D adapter is implemented; external runtime and numerical benchmark evidence remain unavailable.
      - feature: STEADY_1D
        status: UNVERIFIED
        benchmark_ids: []
        reason: No Dayu steady-flow mapping or runtime benchmark is accepted yet.
      - feature: BRANCHED_NETWORK
        status: EXPERIMENTAL
        benchmark_ids: []
        reason: Explicit projected nodes, directed branches, mesh, and cross-section locations are mapped, without external-runtime acceptance evidence.
      - feature: LATERAL_INFLOW
        status: UNVERIFIED
        benchmark_ids: []
        reason: Lateral inflow mapping has not passed an external-runtime benchmark.
      - feature: COMBINED_BOUNDARIES
        status: UNVERIFIED
        benchmark_ids: []
        reason: Combined boundary semantics have not passed an external-runtime benchmark.
      - feature: WEIR
        status: UNVERIFIED
        benchmark_ids: []
        reason: No Dayu-to-D-Flow FM weir mapping has passed a controlled benchmark.
      - feature: CULVERT
        status: UNVERIFIED
        benchmark_ids: []
        reason: The earlier serialization spike is not accepted runtime evidence.
      - feature: BRIDGE
        status: UNVERIFIED
        benchmark_ids: []
        reason: The earlier serialization spike is not accepted runtime evidence.
      - feature: GATE
        status: EXPERIMENTAL
        benchmark_ids: []
        reason: Explicit vertical-underflow Orifice and complete GeneralStructure mappings are typed and fail closed on missing engineering data; no runtime benchmark is accepted.
      - feature: SLUICE
        status: UNVERIFIED
        benchmark_ids: []
        reason: Sluice semantics and native mapping are not implemented in 06A.
      - feature: PUMP
        status: EXPERIMENTAL
        benchmark_ids: []
        reason: Inline aggregate-capacity Pump mapping with an explicit D-Flow head/reduction curve is typed; unit-count semantics and external runtime remain unverified.
      - feature: ORIFICE
        status: EXPERIMENTAL
        benchmark_ids: []
        reason: The audited vertical-underflow Gate subset maps to Orifice, but no controlled external-runtime benchmark has passed.
      - feature: DAM
        status: UNVERIFIED
        benchmark_ids: []
        reason: Dam and breach semantics are not part of the 06A adapter contract.
      - feature: STORAGE_LINK
        status: UNVERIFIED
        benchmark_ids: []
        reason: Storage linkage semantics are not part of the 06A adapter contract.
      - feature: COMPOUND
        status: UNVERIFIED
        benchmark_ids: []
        reason: Compound structures require a future explicit mapping and benchmark.
      - feature: CASIER
        status: UNVERIFIED
        benchmark_ids: []
        reason: No Dayu storage-area mapping has passed a controlled benchmark.
      - feature: DYNAMIC_CONTROL
        status: EXPERIMENTAL
        benchmark_ids: []
        reason: Manual schedules compile to exact audited BMI targets with explicit initial state; coupled runtime execution remains blocked.
      - feature: D_RTC
        status: UNVERIFIED
        benchmark_ids: []
        reason: DIMR/FBC identities are pinned, but exact inactive-state, hysteresis, hold, cooldown, priority, and conflict semantics have no accepted runtime proof.
